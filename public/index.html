<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Ujian Mandiri</title>
    <link rel="stylesheet" href="style.css" />

    <script>
      MathJax = {
        tex: {
          inlineMath: [
            ["$", "$"],
            ["\\(", "\\)"],
          ], // Mengaktifkan $...$ dan \(...\)
          displayMath: [
            ["$$", "$$"],
            ["\\[", "\\]"],
          ], // Mengaktifkan $$...$$ dan \[...\]
        },
      };
    </script>

    <script
      id="MathJax-script"
      async
      src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"
    ></script>
  </head>
  <body>
    <div id="loginPage" class="page active">
      <h2>Login Ujian</h2>
      <input type="text" id="nis" placeholder="Masukkan NIS / Username Admin" />
      <input
        type="password"
        id="password"
        placeholder="Tanggal Lahir (DDMMYYYY)"
      />
      <button id="tombolMasuk">Masuk</button>
    </div>

    <div id="examPage" class="page">
      <h2>Ujian Sedang Berlangsung</h2>
      <div id="timer">Sisa Waktu: 30:00</div>
      <div id="soalContainer"></div>
      <button id="tombolSelesai">Selesai & Kumpulkan</button>
    </div>

    <div id="adminPage" class="page">
      <h2>Dashboard Guru - Rekap Nilai</h2>
      <button id="tombolImport">Import Data Siswa (JSON)</button>
      <table id="tabelHasil">
        <tr>
          <th>NIS</th>
          <th>Nama</th>
          <th>Benar</th>
          <th>Salah</th>
          <th>Kosong</th>
        </tr>
      </table>
      <button id="tombolKeluar">Keluar</button>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
