<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Try Out Penalaran Kuantitatif SNBT</title>
    <link rel="stylesheet" href="style.css" />

    <script>
      MathJax = {
        tex: {
          inlineMath: [
            ["$", "$"],
            ["\\(", "\\)"],
          ], // Mengaktifkan $...$ dan \(...\)
          displayMath: [
            ["$$", "$$"],
            ["\\[", "\\]"],
          ], // Mengaktifkan $$...$$ dan \[...\]
        },
      };
    </script>

    <script
      id="MathJax-script"
      async
      src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"
    ></script>
  </head>
  <body>
    <div id="loginPage" class="page active">
      <h2>Login Ujian PK</h2>
      <input type="text" id="nis" placeholder="Username: (Tuliskan NIS kamu)" />
      <input
        type="password"
        id="password"
        placeholder="Password: (Tuliskan password kamu, format NIS+00)"
      />
      <button id="tombolMasuk">Masuk</button>
    </div>

    <div id="examPage" class="page" style="max-width: 900px">
      <div
        style="
          display: flex;
          justify-content: space-between;
          align-items: center;
          border-bottom: 2px solid var(--border-light);
          margin-bottom: 25px;
          padding-bottom: 15px;
        "
      >
        <h2 style="margin: 0; border: none; padding: 0">
          Try Out Penalaran Kuantitatif SNBT
        </h2>
        <div id="timer" style="margin: 0">Sisa Waktu: 20:00</div>
      </div>

      <div
        class="layout-ujian"
        style="display: flex; gap: 30px; align-items: flex-start"
      >
        <div style="flex: 1; min-width: 200px; max-width: 240px">
          <p style="font-weight: 600; margin-top: 0; margin-bottom: 15px">
            Navigasi Soal:
          </p>
          <div id="gridNomor" class="grid-nomor"></div>
        </div>

        <div style="flex: 3">
          <div id="soalContainer"></div>

          <div
            style="
              display: flex;
              gap: 10px;
              margin-top: 30px;
              margin-bottom: 20px;
            "
          >
            <button id="btnSebelumnya" style="flex: 2">Sebelumnya</button>
            <button id="btnRagu" style="flex: 1; background-color: #f59e0b">
              Ragu
            </button>
            <button id="btnSelanjutnya" style="flex: 2">Selanjutnya</button>
          </div>
          <button id="tombolSelesai" disabled>Selesai & Kumpulkan</button>
        </div>
      </div>
    </div>

    <div id="adminPage" class="page">
      <h2>Dashboard Guru - Rekap Nilai</h2>
      <div style="display: flex; gap: 10px">
        <button id="tombolImport" style="flex: 1">
          Import Data Siswa (JSON)
        </button>
        <button id="tombolEkspor" style="flex: 1; background-color: #059669">
          Ekspor Skor (CSV)
        </button>
      </div>
      <table id="tabelHasil"></table>
      <button id="tombolKeluar">Keluar</button>
    </div>

    <div id="resultPage" class="page" style="text-align: center">
      <h2>Ujian Berhasil Diselesaikan!</h2>
      <p style="font-size: 18px; margin-bottom: 5px; color: var(--text-main)">
        Skor TO PK Kamu:
      </p>

      <!-- Ini bagian skor besar di tengah -->
      <div
        id="skorAkhir"
        style="
          font-size: 80px;
          font-weight: 800;
          color: var(--btn-primary);
          margin: 15px 0;
        "
      >
        0
      </div>

      <p
        id="detailStatistik"
        style="color: var(--text-muted); font-size: 16px; margin-bottom: 30px"
      ></p>
      <button id="btnKembaliKeAwal">Keluar & Kembali ke Awal</button>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
